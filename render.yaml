# Render Blueprint for the RealSync CRM backend (Django + Postgres).
# Deploy from the Render dashboard: New → Blueprint → connect this repo.
# The free plan is enough for the demo; the web service sleeps after
# 15 minutes of inactivity, so the first request after a pause is slow.

services:
  - type: web
    name: realsync-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py ensure_superuser
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/ping/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ${RENDER_EXTERNAL_HOSTNAME}
      - key: DATABASE_URL
        fromDatabase:
          name: realsync-db
          property: connectionString
      # CORS is allow-all until this is set. After the Vercel frontend is
      # deployed, set CORS_ALLOWED_ORIGINS in the Render dashboard to the
      # frontend URL (e.g. https://realsync.vercel.app) to lock it down.
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: realsync-db
    plan: free
    databaseName: realsync
    user: realsync
